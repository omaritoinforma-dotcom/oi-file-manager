services:
  oi-android:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8787"
      OI_DEVICE_TOKEN: ${OI_DEVICE_TOKEN:?Set OI_DEVICE_TOKEN in a private .env}
      OI_MCP_ROUTE_KEY: ${OI_MCP_ROUTE_KEY:?Set OI_MCP_ROUTE_KEY in a private .env}
      OI_API_TOKEN: ${OI_API_TOKEN:-}
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

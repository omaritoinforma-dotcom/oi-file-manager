name: anthropic-wif-test

on:
  push:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);

      - name: Exchange for an Anthropic access token
        shell: bash
        run: |
          set -euo pipefail

          # Print the non-secret claims Anthropic matches against the federation rule
          # (the signed token itself is never printed).
          payload="$(cut -d. -f2 <<<"$JWT" | tr '_-' '/+')"
          while (( ${#payload} % 4 )); do payload+="="; done
          base64 -d <<<"$payload" | jq '{iss, aud, sub, repository, repository_owner, ref, workflow_ref, environment}'

          body="$(mktemp)"
          status="$(
            curl -sS -o "$body" -w '%{http_code}' https://api.anthropic.com/v1/oauth/token \
              -H "content-type: application/json" \
              --data @- <<JSON
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_011fBPAEFJVaZAJxFTA7UNsK",
            "organization_id": "0932ce3f-d75b-4b30-b085-831a80d59a7c",
            "service_account_id": "svac_01GMrppjT71iomS9cRHBo4vj",
            "workspace_id": "wrkspc_01Mtom7NvYxKFLX39RvXozdA"
          }
          JSON
          )"

          echo "HTTP $status"
          jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)' "$body" || cat "$body"
          [[ "$status" == 2* ]]

name: Verificar y compilar APK
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# En un PR solo cuenta la última versión: un push nuevo cancela la ejecución anterior y ahorra
# minutos de Actions. Las ejecuciones de main nunca se cancelan.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar 7-Zip para las pruebas de RAR cifrado
        run: python3 scripts/build_archives.py --host
      - name: Iniciar servidores SFTP, FTP y WebDAV reales para las pruebas de red
        run: |
          curl -sSfL -o rclone.zip https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip
          echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  rclone.zip" | sha256sum -c -
          unzip -q rclone.zip
          python3 -m pip install --quiet cryptography
          RCLONE="$PWD/rclone-v1.75.1-linux-amd64/rclone" python3 scripts/remote_servers.py start >> "$GITHUB_ENV"
      - name: Pruebas y compilación
        env:
          OI_ARCHIVE_TEST_EXECUTABLE: ${{ github.workspace }}/build/native-archives/--host/7zz
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease lintDebug --stacktrace
      - name: Guardar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OI-Archivos-informes
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "OI-Archivos-v0.2.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: OI-Archivos-apk
          path: OI-Archivos-*.apk
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: OI-Archivos-apk
          path: apk
      - name: Iniciar un servidor SFTP real y lento para la reanudación en Android
        env:
          OI_REMOTE_BWLIMIT: 256k
        run: |
          curl -sSfL -o rclone.zip https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip
          echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  rclone.zip" | sha256sum -c -
          unzip -q rclone.zip
          python3 -m pip install --quiet cryptography
          RCLONE="$PWD/rclone-v1.75.1-linux-amd64/rclone" python3 scripts/remote_servers.py start >> "$GITHUB_ENV"
      - name: Servidor FTP en el puerto estándar para la búsqueda en la red local
        run: |
          # Responde como un servidor FTP en el 21; el emulador lo ve en 10.0.2.2:21.
          sudo nohup python3 -c 'import socketserver as s
          class H(s.BaseRequestHandler):
              def handle(self): self.request.sendall(b"220 OI prueba\r\n")
          s.ThreadingTCPServer.allow_reuse_address = True
          s.ThreadingTCPServer(("127.0.0.1", 21), H).serve_forever()' > /dev/null 2>&1 &
          sleep 1
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/21 && head -c 3 <&3'
      - name: Permitir aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verificar la aplicación en Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/smoke_android.py; smoke=$?; python3 scripts/android_features.py; features=$?; exit $((smoke | features))
      - name: Guardar evidencia del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OI-Archivos-Android15
          path: smoke-output/
          if-no-files-found: ignore
  release:
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OI-Archivos-apk
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: OI Archivos v0.2.${{ github.run_number }}
          files: OI-Archivos-*.apk
          make_latest: true
          generate_release_notes: true

name: Verificar y compilar APK
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar 7-Zip para las pruebas de RAR cifrado
        run: python3 scripts/build_archives.py --host
      - name: Pruebas y compilación
        env:
          OI_ARCHIVE_TEST_EXECUTABLE: ${{ github.workspace }}/build/native-archives/--host/7zz
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease lintDebug --stacktrace
      - name: Guardar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OI-Archivos-informes
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "OI-Archivos-v0.2.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: OI-Archivos-apk
          path: OI-Archivos-*.apk
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: OI-Archivos-apk
          path: apk
      - name: Permitir aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verificar la aplicación en Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/smoke_android.py
      - name: Guardar evidencia del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OI-Archivos-Android15
          path: smoke-output/
          if-no-files-found: ignore
  release:
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OI-Archivos-apk
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: OI Archivos v0.2.${{ github.run_number }}
          files: OI-Archivos-*.apk
          make_latest: true
          generate_release_notes: true

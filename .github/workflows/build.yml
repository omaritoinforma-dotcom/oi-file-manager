name: Verificar y compilar APK
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas y compilación
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease lintDebug --stacktrace
      - name: Guardar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OI-Archivos-informes
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "OI-Archivos-v0.2.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: OI-Archivos-apk
          path: OI-Archivos-*.apk
      - name: Publicar versión
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: OI Archivos v0.2.${{ github.run_number }}
          files: OI-Archivos-*.apk
          make_latest: true
          generate_release_notes: true
